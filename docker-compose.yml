version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mynotebooklm-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mynotebooklm_net
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: mynotebooklm-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/mynotebooklm123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - mynotebooklm_net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mynotebooklm-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - uploaded_files:/app/uploaded_files
    depends_on:
      - qdrant
      - neo4j
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mynotebooklm_net
    restart: unless-stopped

networks:
  mynotebooklm_net:
    driver: bridge

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  uploaded_files:
